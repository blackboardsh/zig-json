name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        mode: [Debug, ReleaseSafe, ReleaseFast]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        run: |
          curl --fail --location --retry 3 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo /tmp/zig-x86_64-linux-0.16.0 >> "$GITHUB_PATH"
      - run: zig fmt --check build.zig build.zig.zon src tests.zig tests examples bench integrations/cottontail/api.zig
      - run: zig build test example -Doptimize=${{ matrix.mode }} --summary all
